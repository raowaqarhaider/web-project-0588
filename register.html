
<!DOCTYPE html>
<html>
<head>
    <title>GAMEVERSE - Register</title>
    <link rel="stylesheet" href="register.css">
</head>

<body>

    <!-- NAVIGATION BAR -->

    <div class="navbar">

        <h2 class="logo">GAME<span>VERSE</span></h2>

        <div class="links">
            <a href="index.html">HOME</a>
            <a href="media.html">MEDIA</a>
            <a href="register.html" class="active">REGISTER</a>
            <a href="services.html">SERVICES</a>
            <a href="portfolio.html">PORTFOLIO</a>
            <a href="contact.html">CONTACT</a>
        </div>

    </div>


    <!-- REGISTER SECTION -->

    <div class="register-section">

        <h1>JOIN GAMEVERSE</h1>

        <p class="subtitle">
            Create your account and start your gaming journey.
        </p>


        <div class="form-box">

            <form>

                <h2>Create Your Account</h2>

                <label>Full Name</label>
                <input type="text" placeholder="Enter your full name"
                required minlength="3" maxlength="30">


                <label>Email Address</label>
                <input type="email" placeholder="Enter your email"
                required>


                <label>Username</label>
                <input type="text" placeholder="Choose a username"
                required maxlength="15">


                <label>Password</label>
                <input type="password" placeholder="Create a password"
                required minlength="6">


                <label>Date of Birth</label>
                <input type="date" required>


                <label>Choose Your Platform</label>

                <select required>
                    <option value="" selected disabled>Select Platform</option>
                    <option>PC</option>
                    <option>PlayStation</option>
                    <option>Xbox</option>
                </select>


                <label>Profile Picture</label>
                <input type="file">


                <label>About Yourself</label>
                <textarea rows="4" placeholder="Tell us something about yourself..."></textarea>


                <div class="terms">

                    <input type="checkbox" required>
                    <span>I agree to the terms and conditions.</span>

                </div>


                <input type="submit" value="CREATE ACCOUNT" class="submit-button">

                <input type="reset" value="CLEAR FORM" class="reset-button">

            </form>

        </div>

    </div>


    <!-- FOOTER -->

    <div class="footer">

        <h2>GAME<span>VERSE</span></h2>

        <p>Play Beyond Limits. Discover Your Next Adventure.</p>

        <p>© 2026 GAMEVERSE. All Rights Reserved.</p>

    </div>

</body>
</html>
